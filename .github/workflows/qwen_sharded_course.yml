name: Qwen Sharded Course
'on':
  workflow_call:
    inputs:
      course_slot:
        type: number
        required: true
      workers:
        type: string
        required: true
      review_profile:
        type: string
        default: production
      reuse_sharded_run_id:
        type: string
        default: ''
    secrets:
      QWEN_ASR_TEST_KEY:
        required: true
      DEEPSEEK_API_KEY:
        required: false
      DOUBAO_ASR_API_KEY:
        required: false
permissions:
  contents: read
  actions: read
# The caller holds the shared batch concurrency group. Never reacquire it here.
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
jobs:
  asr:
    name: asr (${{ matrix.course_slot }}, ${{ matrix.shard_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(inputs.workers) }}
    env:
      COURSE_SLOT: ${{ matrix.course_slot }}
      SHARD_ID: ${{ matrix.shard_id }}
      QWEN_ASR_TEST_KEY: ${{ secrets.QWEN_ASR_TEST_KEY }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        python -m pip install cryptography soundfile
        if [ "$REUSE_SHARDED_RUN_ID" = '' ]; then
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install qwen-asr==0.0.6 --no-deps
          python -m pip install transformers==4.57.6 accelerate==1.12.0 nagisa==0.2.11 soynlp==0.0.493 librosa qwen-omni-utils sox
        fi
      env:
        REUSE_SHARDED_RUN_ID: ${{ inputs.reuse_sharded_run_id }}
    - uses: actions/cache@v4
      if: ${{ inputs.reuse_sharded_run_id == '' }}
      with:
        path: ~/.cache/huggingface/hub
        key: qwen-shard-asr-7278e1e-cpu-v1
    - uses: actions/download-artifact@v4
      with:
        name: qwen-shard-audio-${{ matrix.course_slot }}-${{ matrix.shard_id }}
        path: ${{ runner.temp }}/qwen-shards/inbox
    - name: Restore only confirmed prior shard checkpoint
      id: restore
      env:
        GH_TOKEN: ${{ github.token }}
        RESTORE_ARTIFACT: qwen-shard-result-${{ matrix.course_slot }}-${{ matrix.shard_id }}
      run: python -m scripts.sharded_qwen_pilot restore
    - run: python -m scripts.sharded_qwen_pilot worker
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.restore.outcome == 'success' }}
      with:
        name: qwen-shard-result-${{ matrix.course_slot }}-${{ matrix.shard_id }}
        path: |
          ${{ runner.temp }}/qwen-shards/out/worker-result.enc
          ${{ runner.temp }}/qwen-shards/out/diagnostic.enc
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 0
        overwrite: true
    - if: always()
      run: python -m scripts.sharded_qwen_pilot clean
  gather:
    needs: asr
    if: ${{ always() && !cancelled() }}
    name: gather (${{ inputs.course_slot }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COURSE_SLOT: ${{ inputs.course_slot }}
      QWEN_ASR_TEST_KEY: ${{ secrets.QWEN_ASR_TEST_KEY }}
      QWEN_REVIEW_PROFILE: ${{ inputs.review_profile }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        python -m pip install requests cryptography openai
        python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install qwen-asr==0.0.6 --no-deps
        python -m pip install transformers==4.57.6 accelerate==1.12.0 nagisa==0.2.11 soynlp==0.0.493 librosa soundfile qwen-omni-utils sox
        if ! command -v ffmpeg >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        fi
    - uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: qwen-shard-aligner-c7cbfc20-cpu-v1
    - uses: actions/download-artifact@v4
      with:
        name: qwen-shard-input-${{ inputs.course_slot }}
        path: ${{ runner.temp }}/qwen-shards/inbox
    - uses: actions/download-artifact@v4
      with:
        pattern: qwen-shard-result-${{ inputs.course_slot }}-*
        path: ${{ runner.temp }}/qwen-shards/results
    - name: Restore prior finalization without resetting cloud quota
      id: restore
      env:
        GH_TOKEN: ${{ github.token }}
        RESTORE_ARTIFACT: qwen-shard-final-${{ inputs.course_slot }}
      run: python -m scripts.sharded_qwen_pilot restore
    - name: Validate all blocks, review once, summarize without publishing
      env:
        GH_TOKEN: ${{ github.token }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DOUBAO_ASR_API_KEY: ${{ secrets.DOUBAO_ASR_API_KEY }}
      run: python -m scripts.sharded_qwen_pilot gather
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.restore.outcome == 'success' }}
      with:
        name: qwen-shard-final-${{ inputs.course_slot }}
        path: ${{ runner.temp }}/qwen-shards/out/result.enc
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 0
        overwrite: true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qwen-shard-gather-diagnostic-${{ inputs.course_slot }}
        path: ${{ runner.temp }}/qwen-shards/out/diagnostic.enc
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 0
        overwrite: true
    - if: always()
      run: python -m scripts.sharded_qwen_pilot clean

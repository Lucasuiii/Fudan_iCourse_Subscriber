name: Delete Course Data

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque request ID generated by the private frontend"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: icourse-data-${{ github.repository }}
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pycryptodome

      - name: Fetch and decrypt database
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        run: |
          git fetch --depth=1 origin "+refs/heads/data:refs/remotes/origin/data" \
            || { echo "::error::Could not fetch the existing data branch."; exit 1; }
          mkdir -p data/sharded/shards
          if git cat-file -e origin/data:data/icourse-index.enc 2>/dev/null; then
            git show origin/data:data/icourse-index.enc > data/sharded/icourse-index.enc
            shard_paths=$(git ls-tree -r --name-only origin/data | grep '^data/shards/' || true)
            for path in $shard_paths; do
              base=$(basename "$path")
              git show "origin/data:$path" > "data/sharded/shards/$base"
            done
            rm -f data/icourse.db.reassembled
            python scripts/db_shard.py reassemble data/sharded data/icourse.db.reassembled
            python scripts/validate_db.py data/icourse.db.reassembled
            mv data/icourse.db.reassembled data/icourse.db
          else
            echo "::error::No sharded database found on data branch."
            exit 1
          fi

      - name: Delete lecture(s) or course(s)
        env:
          PRIVATE_ACTION_REQUEST: ${{ secrets.DELETE_REQUEST }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          request_env=$(python scripts/private_action_request.py delete "$REQUEST_ID") || exit 2
          eval "$request_env"
          unset PRIVATE_ACTION_REQUEST REQUEST_ID
          if [ -z "$COURSE_IDS_INPUT" ]; then
            echo "::error::No courses selected for deletion."
            exit 2
          fi
          SUB_IDS="$SUB_IDS_INPUT"
          IFS=',' read -ra CIDS <<< "$COURSE_IDS_INPUT"
          for cid in "${CIDS[@]}"; do
            cid=$(echo "$cid" | xargs)
            if [ -n "$SUB_IDS" ]; then
              echo "Deleting selected lecture data..."
              IFS=',' read -ra SIDS <<< "$SUB_IDS"
              for sid in "${SIDS[@]}"; do
                sid=$(echo "$sid" | xargs)
                sqlite3 data/icourse.db "DELETE FROM ppt_pages WHERE sub_id='$sid'"
                sqlite3 data/icourse.db "DELETE FROM lectures WHERE sub_id='$sid'"
              done
              remaining=$(sqlite3 data/icourse.db "SELECT COUNT(*) FROM lectures WHERE course_id='$cid'")
              echo "  $remaining lecture(s) remaining for selected course"
              if [ "$remaining" -eq 0 ]; then
                sqlite3 data/icourse.db "DELETE FROM courses WHERE course_id='$cid'"
                echo "  Empty course record removed"
              fi
            else
              echo "Deleting selected course data..."
              count=$(sqlite3 data/icourse.db "SELECT COUNT(*) FROM lectures WHERE course_id='$cid'")
              sqlite3 data/icourse.db "DELETE FROM ppt_pages WHERE sub_id IN (SELECT sub_id FROM lectures WHERE course_id='$cid')"
              sqlite3 data/icourse.db "DELETE FROM lectures WHERE course_id='$cid'"
              sqlite3 data/icourse.db "DELETE FROM courses WHERE course_id='$cid'"
              echo "  Removed $count lecture(s) from selected course"
            fi
          done

      # NOTE: COURSE_IDS is deliberately NOT touched here.  GitHub's
      # Secrets API is write-only (values can never be read back), so a
      # workflow cannot remove one ID from the list.  The frontend's
      # subscription editor owns that secret — it re-encrypts and PUTs
      # the full list whenever the user changes their subscription.

      - name: Re-shard and push
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_db.py data/icourse.db
          # Shard into a fresh directory — data/sharded still holds the
          # fetched pre-delete shard files, and a deleted course's shard
          # must not survive into the push.
          rm -rf data/sharded_out
          mkdir -p data/sharded_out
          python scripts/db_shard.py shard data/icourse.db data/sharded_out

          # Preserve data-branch history so an accidental deletion remains
          # recoverable. Shared workflow concurrency prevents write races.
          rm -rf /tmp/db_deploy
          mkdir -p /tmp/db_deploy
          cd /tmp/db_deploy

          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin data
          git checkout -q -b data FETCH_HEAD
          rm -rf data
          mkdir -p data/shards
          cp "$GITHUB_WORKSPACE/data/sharded_out/icourse-index.enc" data/
          cp "$GITHUB_WORKSPACE"/data/sharded_out/shards/*.db.gz.enc data/shards/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No encrypted database changes to publish."
            exit 0
          fi
          git commit -q -m "chore: delete selected course data"
          git push origin data

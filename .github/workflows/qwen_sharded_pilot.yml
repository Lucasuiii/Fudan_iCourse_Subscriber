name: Qwen Single-Lecture Sharded Pilot
'on':
  push:
    branches: [codex/qwen-production-pilot]
    paths:
    - .github/workflows/qwen_sharded_pilot.yml
    - scripts/qwen_sharding.py
    - scripts/sharded_qwen_pilot.py
    - tests/test_qwen_sharding.py
  workflow_dispatch:
    inputs:
      baselines:
        description: 'JSON list of completed baseline run_id/artifact references; maximum five courses'
        type: string
        required: true
      shard_mode:
        description: 'Start with two runners; auto experiments with three above 60 minutes of planned audio'
        type: choice
        options: ['2', auto]
        default: '2'
      review_profile:
        description: 'Keep production quota for the first comparison; pilot15 experiments with 900s/18 clips'
        type: choice
        options: [production, pilot15]
        default: production
      reuse_sharded_run_id:
        description: 'Optional completed sharded experiment: reuse its ASR to test another quota; keep baseline list/order unchanged'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
# Shared with subscriber publishing: one batch at a time, never 5 courses x 15 workers.
concurrency:
  group: icourse-data-${{ github.repository }}
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
jobs:
  validate:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate synthetic plans only, without credentials or course access
      env:
        PYTHONPATH: tests
      run: python -m unittest test_qwen_sharding.ShardPlanTests
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      courses: ${{ steps.plan.outputs.courses }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - id: plan
      env:
        BASELINES: ${{ inputs.baselines }}
      run: python -m scripts.sharded_qwen_pilot plan
  prepare:
    needs: plan
    name: prepare (${{ matrix.course_slot }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.courses) }}
    env:
      COURSE_SLOT: ${{ matrix.course_slot }}
      SHARD_MODE: ${{ inputs.shard_mode }}
      BASELINE_RUN_ID: ${{ matrix.run_id }}
      BASELINE_ARTIFACT: ${{ matrix.artifact }}
      QWEN_ASR_TEST_KEY: ${{ secrets.QWEN_ASR_TEST_KEY }}
      GH_TOKEN: ${{ github.token }}
      REUSE_SHARDED_RUN_ID: ${{ inputs.reuse_sharded_run_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        python -m pip install requests pycryptodome cryptography
        if ! command -v ffmpeg >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        fi
    - name: Reacquire exact baseline lecture and pack original blocks
      env:
        StuId: ${{ secrets.STUID }}
        UISPsw: ${{ secrets.UISPSW }}
      run: python -m scripts.sharded_qwen_pilot prepare
    - uses: actions/upload-artifact@v4
      with:
        name: qwen-shard-plan-${{ matrix.course_slot }}
        path: ${{ runner.temp }}/qwen-shards/out/plan.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
    - uses: actions/upload-artifact@v4
      with:
        name: qwen-shard-input-${{ matrix.course_slot }}
        path: ${{ runner.temp }}/qwen-shards/out/input.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
    - uses: actions/upload-artifact@v4
      with:
        name: qwen-shard-audio-${{ matrix.course_slot }}-0
        path: ${{ runner.temp }}/qwen-shards/out/shard-0.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
    - uses: actions/upload-artifact@v4
      with:
        name: qwen-shard-audio-${{ matrix.course_slot }}-1
        path: ${{ runner.temp }}/qwen-shards/out/shard-1.enc
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 0
        overwrite: true
    - uses: actions/upload-artifact@v4
      with:
        name: qwen-shard-audio-${{ matrix.course_slot }}-2
        path: ${{ runner.temp }}/qwen-shards/out/shard-2.enc
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 0
        overwrite: true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qwen-shard-prepare-diagnostic-${{ matrix.course_slot }}
        path: |
          ${{ runner.temp }}/qwen-shards/out/diagnostic.enc
          ${{ runner.temp }}/qwen-benchmark/result.enc
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 0
        overwrite: true
    - if: always()
      run: python -m scripts.sharded_qwen_pilot clean
  plan_workers:
    needs: [plan, prepare]
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.plan.outputs.workers }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install cryptography
    - uses: actions/download-artifact@v4
      with:
        pattern: qwen-shard-plan-*
        path: ${{ runner.temp }}/qwen-shards/plans
    - id: plan
      env:
        BASELINES: ${{ inputs.baselines }}
        QWEN_ASR_TEST_KEY: ${{ secrets.QWEN_ASR_TEST_KEY }}
      run: python -m scripts.sharded_qwen_pilot workers
    - if: always()
      run: python -m scripts.sharded_qwen_pilot clean
  asr:
    needs: plan_workers
    name: asr (${{ matrix.course_slot }}, ${{ matrix.shard_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan_workers.outputs.workers) }}
    env:
      COURSE_SLOT: ${{ matrix.course_slot }}
      SHARD_ID: ${{ matrix.shard_id }}
      QWEN_ASR_TEST_KEY: ${{ secrets.QWEN_ASR_TEST_KEY }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        python -m pip install cryptography soundfile
        if [ "$REUSE_SHARDED_RUN_ID" = '' ]; then
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install qwen-asr==0.0.6 --no-deps
          python -m pip install transformers==4.57.6 accelerate==1.12.0 nagisa==0.2.11 soynlp==0.0.493 librosa qwen-omni-utils sox
        fi
      env:
        REUSE_SHARDED_RUN_ID: ${{ inputs.reuse_sharded_run_id }}
    - uses: actions/cache@v4
      if: ${{ inputs.reuse_sharded_run_id == '' }}
      with:
        path: ~/.cache/huggingface/hub
        key: qwen-shard-asr-7278e1e-cpu-v1
    - uses: actions/download-artifact@v4
      with:
        name: qwen-shard-audio-${{ matrix.course_slot }}-${{ matrix.shard_id }}
        path: ${{ runner.temp }}/qwen-shards/inbox
    - name: Restore only confirmed prior shard checkpoint
      id: restore
      env:
        GH_TOKEN: ${{ github.token }}
        RESTORE_ARTIFACT: qwen-shard-result-${{ matrix.course_slot }}-${{ matrix.shard_id }}
      run: python -m scripts.sharded_qwen_pilot restore
    - run: python -m scripts.sharded_qwen_pilot worker
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.restore.outcome == 'success' }}
      with:
        name: qwen-shard-result-${{ matrix.course_slot }}-${{ matrix.shard_id }}
        path: |
          ${{ runner.temp }}/qwen-shards/out/worker-result.enc
          ${{ runner.temp }}/qwen-shards/out/diagnostic.enc
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 0
        overwrite: true
    - if: always()
      run: python -m scripts.sharded_qwen_pilot clean
  gather:
    needs: [plan, prepare, plan_workers, asr]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.plan_workers.result == 'success' }}
    name: gather (${{ matrix.course_slot }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.plan.outputs.courses) }}
    env:
      COURSE_SLOT: ${{ matrix.course_slot }}
      QWEN_ASR_TEST_KEY: ${{ secrets.QWEN_ASR_TEST_KEY }}
      QWEN_REVIEW_PROFILE: ${{ inputs.review_profile }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        python -m pip install requests cryptography openai
        python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install qwen-asr==0.0.6 --no-deps
        python -m pip install transformers==4.57.6 accelerate==1.12.0 nagisa==0.2.11 soynlp==0.0.493 librosa soundfile qwen-omni-utils sox
        if ! command -v ffmpeg >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        fi
    - uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: qwen-shard-aligner-c7cbfc20-cpu-v1
    - uses: actions/download-artifact@v4
      with:
        name: qwen-shard-input-${{ matrix.course_slot }}
        path: ${{ runner.temp }}/qwen-shards/inbox
    - uses: actions/download-artifact@v4
      with:
        pattern: qwen-shard-result-${{ matrix.course_slot }}-*
        path: ${{ runner.temp }}/qwen-shards/results
    - name: Restore prior finalization without resetting cloud quota
      id: restore
      env:
        GH_TOKEN: ${{ github.token }}
        RESTORE_ARTIFACT: qwen-shard-final-${{ matrix.course_slot }}
      run: python -m scripts.sharded_qwen_pilot restore
    - name: Validate all blocks, review once, summarize without publishing
      env:
        GH_TOKEN: ${{ github.token }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DOUBAO_ASR_API_KEY: ${{ secrets.DOUBAO_ASR_API_KEY }}
      run: python -m scripts.sharded_qwen_pilot gather
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.restore.outcome == 'success' }}
      with:
        name: qwen-shard-final-${{ matrix.course_slot }}
        path: |
          ${{ runner.temp }}/qwen-shards/out/result.enc
          ${{ runner.temp }}/qwen-shards/out/diagnostic.enc
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 0
        overwrite: true
    - if: always()
      run: python -m scripts.sharded_qwen_pilot clean

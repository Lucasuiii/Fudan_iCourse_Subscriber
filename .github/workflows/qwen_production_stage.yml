name: Qwen Production Pool Stage
run-name: icourse-stage-${{ inputs.parent_run_id }}-${{ inputs.ticket }}
'on':
  push:
    branches: [codex/global-runner-pool]
    paths: [.github/workflows/qwen_production_stage.yml]
  workflow_dispatch:
    inputs:
      parent_run_id:
        type: string
        required: true
        description: Existing authorized parent run
      ticket:
        type: string
        required: true
        description: Opaque durable stage reservation
permissions:
  contents: write
  actions: read
jobs:
  register:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
    - run: echo 'Pool stage entry registered; no classroom processing on push'
  execute:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
      QWEN_PRODUCTION_TASK: 'true'
      POOL_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      POOL_TICKET: ${{ inputs.ticket }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: python -m pip install cryptography pycryptodome requests
    - name: Verify journal-bound stage before credentials or models
      id: authorize
      run: python -m scripts.production_pool_stage bootstrap
    - uses: ./.github/actions/qwen-pilot-runtime
      if: ${{ steps.authorize.outputs.stage == 'prepare' || steps.authorize.outputs.stage == 'gather' }}
      with:
        inference: ${{ steps.authorize.outputs.stage == 'gather' && 'true' || 'false' }}
    - run: |-
        python -m pip install cryptography soundfile
        if [ "$SHARD_ID" != '-1' ]; then
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install qwen-asr==0.0.6 --no-deps
          python -m pip install transformers==4.57.6 accelerate==1.12.0 nagisa==0.2.11 soynlp==0.0.493 librosa qwen-omni-utils sox
        fi
      if: ${{ steps.authorize.outputs.stage == 'asr' }}
    - uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: qwen-production-asr-7278e1e-cpu-v1
      if: ${{ steps.authorize.outputs.stage == 'asr' }}
    - name: Execute reserved pipeline stage
      if: ${{ steps.authorize.outcome == 'success' && steps.authorize.outputs.stage != 'gather' }}
      run: python -m scripts.production_pool_stage execute
      env:
        COURSE_IDS: ${{ steps.authorize.outputs.stage != 'asr' && secrets.COURSE_IDS || '' }}
        DOUBAO_ASR_API_KEY: ${{ steps.authorize.outputs.stage != 'asr' && secrets.DOUBAO_ASR_API_KEY || '' }}
        TAVILY_API_KEY: ${{ steps.authorize.outputs.stage != 'asr' && secrets.TAVILY_API_KEY || '' }}
        DASHSCOPE_API_KEY: ${{ steps.authorize.outputs.stage != 'asr' && secrets.DASHSCOPE_API_KEY || '' }}
        SMTP_PASSWORD: ${{ steps.authorize.outputs.stage != 'asr' && secrets.SMTP_PASSWORD || '' }}
        DEEPSEEK_API_KEY: ${{ steps.authorize.outputs.stage != 'asr' && secrets.DEEPSEEK_API_KEY || '' }}
        GEMINI_API_KEY: ${{ steps.authorize.outputs.stage != 'asr' && secrets.GEMINI_API_KEY || '' }}
        DASHSCOPE_BASE_URL: ${{ steps.authorize.outputs.stage != 'asr' && secrets.DASHSCOPE_BASE_URL || '' }}
        DEEPSEEK_BASE_URL: ${{ steps.authorize.outputs.stage != 'asr' && secrets.DEEPSEEK_BASE_URL || '' }}
        GEMINI_BASE_URL: ${{ steps.authorize.outputs.stage != 'asr' && secrets.GEMINI_BASE_URL || '' }}
        StuId: ${{ steps.authorize.outputs.stage != 'asr' && secrets.STUID || '' }}
        UISPsw: ${{ steps.authorize.outputs.stage != 'asr' && secrets.UISPSW || '' }}
    - name: Finalize through LectureRunner with saved quota
      if: ${{ steps.authorize.outcome == 'success' && steps.authorize.outputs.stage == 'gather' }}
      run: python -m scripts.production_pool_stage execute
      env:
        COURSE_IDS: ${{ steps.authorize.outputs.stage != 'asr' && secrets.COURSE_IDS || '' }}
        DOUBAO_ASR_API_KEY: ${{ steps.authorize.outputs.stage != 'asr' && secrets.DOUBAO_ASR_API_KEY || '' }}
        TAVILY_API_KEY: ${{ steps.authorize.outputs.stage != 'asr' && secrets.TAVILY_API_KEY || '' }}
        DASHSCOPE_API_KEY: ${{ steps.authorize.outputs.stage != 'asr' && secrets.DASHSCOPE_API_KEY || '' }}
        SMTP_PASSWORD: ${{ steps.authorize.outputs.stage != 'asr' && secrets.SMTP_PASSWORD || '' }}
        DEEPSEEK_API_KEY: ${{ steps.authorize.outputs.stage != 'asr' && secrets.DEEPSEEK_API_KEY || '' }}
        GEMINI_API_KEY: ${{ steps.authorize.outputs.stage != 'asr' && secrets.GEMINI_API_KEY || '' }}
        DASHSCOPE_BASE_URL: ${{ steps.authorize.outputs.stage != 'asr' && secrets.DASHSCOPE_BASE_URL || '' }}
        DEEPSEEK_BASE_URL: ${{ steps.authorize.outputs.stage != 'asr' && secrets.DEEPSEEK_BASE_URL || '' }}
        GEMINI_BASE_URL: ${{ steps.authorize.outputs.stage != 'asr' && secrets.GEMINI_BASE_URL || '' }}
        StuId: ${{ steps.authorize.outputs.stage != 'asr' && secrets.STUID || '' }}
        UISPsw: ${{ steps.authorize.outputs.stage != 'asr' && secrets.UISPSW || '' }}
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.authorize.outputs.stage == 'prepare' }}
      with:
        name: qwen-production-prepare-${{ env.COURSE_SLOT }}
        path: |-
          ${{ runner.temp }}/qwen-shards/out/prepared.enc
          ${{ runner.temp }}/qwen-shards/out/prepared-*-part-*.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.authorize.outputs.stage == 'prepare' }}
      with:
        name: qwen-production-prepare-audit-${{ env.COURSE_SLOT }}
        path: ${{ runner.temp }}/qwen-shards/out/prepare-failure.json
        retention-days: 7
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.authorize.outputs.stage == 'asr' }}
      with:
        name: qwen-production-asr-${{ env.COURSE_SLOT }}-${{ env.SHARD_ID }}
        path: ${{ runner.temp }}/qwen-shards/out/worker-result.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.authorize.outputs.stage == 'asr' }}
      with:
        name: qwen-production-shared-${{ env.COURSE_SLOT }}-${{ env.SHARD_ID }}
        path: |
          ${{ runner.temp }}/qwen-shards/out/shared-queue.enc
          ${{ runner.temp }}/qwen-shards/out/shared-local.enc
          ${{ runner.temp }}/qwen-shards/out/worker-audit.json
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.authorize.outputs.stage == 'gather' }}
      with:
        name: qwen-production-state-${{ env.COURSE_SLOT }}
        path: ${{ runner.temp }}/qwen-shards/out/state.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.authorize.outputs.stage == 'gather' }}
      with:
        name: qwen-validation-result-${{ env.COURSE_SLOT }}
        path: ${{ runner.temp }}/qwen-shards/out/validation-result.json
        retention-days: 7
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.authorize.outputs.stage == 'publish' }}
      with:
        name: qwen-production-published-${{ env.COURSE_SLOT }}
        path: ${{ runner.temp }}/qwen-shards/out/published.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.authorize.outputs.stage == 'prepare' }}
      with:
        name: qwen-production-worker-plan-${{ env.COURSE_SLOT }}
        path: ${{ runner.temp }}/qwen-shards/out/worker-plan.enc
        retention-days: 7
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.authorize.outcome == 'success' }}
      with:
        name: qwen-production-stage-audit
        path: ${{ runner.temp }}/qwen-shards/out/stage-audit.json
        retention-days: 7
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.authorize.outputs.stage == 'prepare' }}
      with:
        name: qwen-production-worker-input-${{ env.COURSE_SLOT }}
        path: ${{ runner.temp }}/qwen-shards/out/worker-input/*.enc
        retention-days: 7
        compression-level: 0
        overwrite: true
        if-no-files-found: ignore
    - uses: actions/upload-artifact@v4
      if: ${{ always() && steps.authorize.outputs.stage == 'prepare' }}
      with:
        name: qwen-production-prepare-timing-${{ env.COURSE_SLOT }}
        path: ${{ runner.temp }}/qwen-shards/out/prepare-timing.json
        retention-days: 7
        overwrite: true
        if-no-files-found: ignore
    - name: clean
      if: ${{ always() }}
      run: python -m scripts.production_qwen clean

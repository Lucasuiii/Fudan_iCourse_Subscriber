name: Qwen CPU model runtime
description: Install the pinned CPU-only Qwen inference runtime
inputs:
  extras:
    description: Install recognition dependencies when requirements.txt was not installed
    default: 'false'
runs:
  using: composite
  steps:
  - shell: bash
    env:
      INSTALL_RECOGNITION_EXTRAS: ${{ inputs.extras }}
    run: |
      python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      python -m pip install qwen-asr==0.0.6 --no-deps
      if [ "$INSTALL_RECOGNITION_EXTRAS" = 'true' ]; then
        python -m pip install transformers==4.57.6 accelerate==1.12.0 nagisa==0.2.11 soynlp==0.0.493 librosa qwen-omni-utils sox
      fi

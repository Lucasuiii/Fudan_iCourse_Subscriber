name: Qwen pilot runtime
description: Shared production preparation and finalization dependencies
inputs:
  inference:
    description: Install the pinned Qwen CPU runtime for recognition or alignment
    default: 'false'
runs:
  using: composite
  steps:
  - uses: actions/setup-python@v5
    with:
      python-version: '3.12'
      cache: pip
  - uses: actions/setup-node@v4
    with:
      node-version: '24'
      cache: npm
  - shell: bash
    run: |
      python -m pip install -r requirements.txt
      npm ci --ignore-scripts
      sudo apt-get update
      sudo apt-get install -y ffmpeg fonts-noto-cjk libpango-1.0-0 libcairo2
      if [ ! -f silero_vad.onnx ]; then
        curl --fail --silent --show-error --location -o silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
      fi
  - if: inputs.inference == 'true'
    shell: bash
    run: |
      python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      python -m pip install qwen-asr==0.0.6 --no-deps
  - uses: actions/cache@v4
    with:
      path: |
        ~/.cache/huggingface/hub
        ~/.cache/rapidocr
      key: qwen-production-7278e1e-c7cbfc20-cpu-v1
